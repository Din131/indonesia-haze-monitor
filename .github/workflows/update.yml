name: Update hotspots and air quality

on:
  schedule:
    # Every 3 hours (minute 23 avoids the busy top of the hour).
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Run pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m haze.run

      - name: Commit new data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data docs/data; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
            git pull --rebase origin main
            git push
          fi
